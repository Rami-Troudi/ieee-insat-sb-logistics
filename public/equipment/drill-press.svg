<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a precision bench drill press">
  <defs>
    <linearGradient id="dp-bg" x2="0" y2="1">
      <stop stop-color="#f8fafc" />
      <stop offset="1" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="dp-metal" x2="1" y2="0">
      <stop stop-color="#cbd5e1" />
      <stop offset="0.5" stop-color="#f1f5f9" />
      <stop offset="1" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="dp-housing" x2="1" y2="1">
      <stop stop-color="#059669" />
      <stop offset="1" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#dp-bg)" />
  <ellipse cx="400" cy="510" rx="260" ry="32" fill="#64748b" opacity=".2" />
  <!-- Base Plate -->
  <rect x="230" y="470" width="340" height="42" rx="8" fill="#334155" stroke="#1e293b" stroke-width="6" />
  <rect x="260" y="480" width="280" height="10" rx="4" fill="#1e293b" />
  <!-- Vertical Steel Column -->
  <rect x="365" y="110" width="50" height="365" fill="url(#dp-metal)" stroke="#475569" stroke-width="6" />
  <line x1="380" y1="120" x2="380" y2="470" stroke="#f8fafc" stroke-width="3" opacity="0.6" />
  <!-- Adjustable Work Table -->
  <rect x="280" y="380" width="220" height="28" rx="6" fill="#475569" stroke="#1e293b" stroke-width="5" />
  <rect x="300" y="386" width="180" height="8" rx="3" fill="#1e293b" />
  <circle cx="390" cy="418" r="10" fill="#64748b" />
  <!-- Main Drill Head Unit -->
  <rect x="250" y="100" width="240" height="150" rx="16" fill="url(#dp-housing)" stroke="#064e3b" stroke-width="7" />
  <!-- Digital Display Panel -->
  <rect x="270" y="125" width="110" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="3" />
  <text x="285" y="160" font-family="monospace" font-size="22" font-weight="bold" fill="#34d399">1250</text>
  <text x="345" y="155" font-family="sans-serif" font-size="10" fill="#a7f3d0">RPM</text>
  <text x="285" y="180" font-family="sans-serif" font-size="9" fill="#6ee7b7">LASER ON</text>
  <!-- Power & Control Knobs -->
  <circle cx="410" cy="155" r="18" fill="#ef4444" stroke="#7f1d1d" stroke-width="3" />
  <circle cx="455" cy="155" r="14" fill="#334155" stroke="#1e293b" stroke-width="3" />
  <!-- Spindle / Quill Assembly -->
  <rect x="305" y="248" width="40" height="50" fill="url(#dp-metal)" stroke="#475569" stroke-width="4" />
  <!-- Drill Chuck -->
  <rect x="295" y="295" width="60" height="40" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="4" />
  <!-- Drill Bit with flutes -->
  <polygon points="320,335 330,335 328,380 325,385 322,380" fill="#94a3b8" stroke="#475569" stroke-width="2" />
  <line x1="322" y1="345" x2="328" y2="352" stroke="#475569" stroke-width="2" />
  <line x1="322" y1="360" x2="328" y2="367" stroke="#475569" stroke-width="2" />
  <!-- Side Feed Wheel / Handwheel -->
  <circle cx="515" cy="170" r="28" fill="#334155" stroke="#1e293b" stroke-width="5" />
  <line x1="515" y1="142" x2="515" y2="90" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" />
  <circle cx="515" cy="85" r="10" fill="#0f172a" />
  <line x1="540" y1="185" x2="585" y2="210" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" />
  <circle cx="590" cy="214" r="10" fill="#0f172a" />
  <line x1="490" y1="185" x2="445" y2="210" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" />
  <circle cx="440" cy="214" r="10" fill="#0f172a" />
</svg>
