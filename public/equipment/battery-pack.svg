<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a 3S LiPo battery pack">
  <defs>
    <linearGradient id="bp-bg" x2="0" y2="1">
      <stop stop-color="#ecfeff" />
      <stop offset="1" stop-color="#cffafe" />
    </linearGradient>
    <linearGradient id="bp-body" x2="1" y2="1">
      <stop stop-color="#0284c7" />
      <stop offset="1" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#bp-bg)" />
  <ellipse cx="400" cy="460" rx="250" ry="34" fill="#64748b" opacity=".2" />
  <g transform="rotate(-6 400 300)">
    <!-- Battery Main Pack (Blue PVC shrink wrap) -->
    <rect x="220" y="210" width="360" height="180" rx="18" fill="url(#bp-body)" stroke="#075985" stroke-width="8" />
    <!-- 3 Cell Segments Lines -->
    <line x1="220" y1="270" x2="580" y2="270" stroke="#0369a1" stroke-width="4" opacity="0.6" />
    <line x1="220" y1="330" x2="580" y2="330" stroke="#0369a1" stroke-width="4" opacity="0.6" />
    <!-- Label Panel -->
    <rect x="250" y="235" width="300" height="130" rx="10" fill="#0f172a" />
    <text x="270" y="275" font-family="sans-serif" font-size="26" font-weight="bold" fill="#38bdf8" letter-spacing="1">TURNIGY LiPo</text>
    <text x="270" y="315" font-family="monospace" font-size="34" font-weight="bold" fill="#facc15">2200<tspan font-size="20"> mAh</tspan></text>
    <text x="270" y="348" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">3S1P • 11.1V • 25C DISCHARGE</text>
    <rect x="475" y="250" width="60" height="40" rx="6" fill="#ef4444" />
    <text x="483" y="277" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">MAX</text>
    <!-- Heavy 12AWG Red & Black Power Cables -->
    <path d="M220 250 C 140 230, 110 320, 140 370" fill="none" stroke="#dc2626" stroke-width="14" stroke-linecap="round" />
    <path d="M220 280 C 160 270, 130 350, 160 390" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
    <!-- Yellow XT60 Connector -->
    <g transform="translate(130, 370) rotate(45)">
      <polygon points="0,0 35,0 45,15 45,35 0,35" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
      <circle cx="15" cy="18" r="6" fill="#ca8a04" />
      <circle cx="30" cy="18" r="6" fill="#ca8a04" />
    </g>
    <!-- White 4-Pin JST-XH Balance Cable -->
    <path d="M220 350 C 170 370, 160 440, 210 450" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />
    <rect x="200" y="435" width="35" height="25" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="3" />
    <circle cx="208" cy="447" r="2" fill="#0f172a" />
    <circle cx="215" cy="447" r="2" fill="#0f172a" />
    <circle cx="222" cy="447" r="2" fill="#0f172a" />
    <circle cx="229" cy="447" r="2" fill="#0f172a" />
  </g>
</svg>
