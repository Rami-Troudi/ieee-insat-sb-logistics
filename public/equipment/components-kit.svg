<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of electronic resistors and LEDs assortment kit">
  <defs>
    <linearGradient id="ck-bg" x2="0" y2="1">
      <stop stop-color="#f0fdf4" />
      <stop offset="1" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="ck-res" x2="0" y2="1">
      <stop stop-color="#fed7aa" />
      <stop offset="1" stop-color="#fdba74" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#ck-bg)" />
  <ellipse cx="400" cy="480" rx="260" ry="34" fill="#64748b" opacity=".2" />
  <!-- Resistors on carrier tape -->
  <g transform="rotate(-6 380 230)">
    <!-- Long Wire Leads -->
    <line x1="120" y1="180" x2="680" y2="180" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="120" y1="260" x2="680" y2="260" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <!-- Resistor 1 (1k Ohm: Brown Black Red Gold) -->
    <rect x="180" y="165" width="110" height="30" rx="10" fill="url(#ck-res)" stroke="#ea580c" stroke-width="2" />
    <rect x="200" y="165" width="8" height="30" fill="#78350f" />
    <rect x="220" y="165" width="8" height="30" fill="#0f172a" />
    <rect x="240" y="165" width="8" height="30" fill="#dc2626" />
    <rect x="265" y="165" width="8" height="30" fill="#eab308" />
    <!-- Resistor 2 (10k Ohm: Brown Black Orange Gold) -->
    <rect x="340" y="165" width="110" height="30" rx="10" fill="url(#ck-res)" stroke="#ea580c" stroke-width="2" />
    <rect x="360" y="165" width="8" height="30" fill="#78350f" />
    <rect x="380" y="165" width="8" height="30" fill="#0f172a" />
    <rect x="400" y="165" width="8" height="30" fill="#f97316" />
    <rect x="425" y="165" width="8" height="30" fill="#eab308" />
    <!-- Resistor 3 (220 Ohm: Red Red Brown Gold) -->
    <rect x="500" y="165" width="110" height="30" rx="10" fill="url(#ck-res)" stroke="#ea580c" stroke-width="2" />
    <rect x="520" y="165" width="8" height="30" fill="#dc2626" />
    <rect x="540" y="165" width="8" height="30" fill="#dc2626" />
    <rect x="560" y="165" width="8" height="30" fill="#78350f" />
    <rect x="585" y="165" width="8" height="30" fill="#eab308" />
    <!-- Resistor 4 (lower row) -->
    <rect x="260" y="245" width="110" height="30" rx="10" fill="url(#ck-res)" stroke="#ea580c" stroke-width="2" />
    <rect x="280" y="245" width="8" height="30" fill="#eab308" />
    <rect x="300" y="245" width="8" height="30" fill="#7c3aed" />
    <rect x="320" y="245" width="8" height="30" fill="#dc2626" />
    <rect x="345" y="245" width="8" height="30" fill="#eab308" />
    <!-- Resistor 5 -->
    <rect x="420" y="245" width="110" height="30" rx="10" fill="url(#ck-res)" stroke="#ea580c" stroke-width="2" />
    <rect x="440" y="245" width="8" height="30" fill="#2563eb" />
    <rect x="460" y="245" width="8" height="30" fill="#16a34a" />
    <rect x="480" y="245" width="8" height="30" fill="#78350f" />
    <rect x="505" y="245" width="8" height="30" fill="#eab308" />
  </g>
  <!-- Diffuse 5mm LEDs Standing in Foreground -->
  <g transform="translate(0, 50)">
    <!-- Red LED -->
    <g transform="translate(190, 310)">
      <line x1="28" y1="55" x2="28" y2="130" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
      <line x1="42" y1="55" x2="42" y2="145" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
      <path d="M20 55 L20 30 C20 10, 50 10, 50 30 L50 55 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3" />
      <ellipse cx="35" cy="55" rx="18" ry="6" fill="#dc2626" stroke="#b91c1c" stroke-width="2" />
      <ellipse cx="35" cy="25" rx="8" ry="12" fill="#fca5a5" opacity="0.6" />
    </g>
    <!-- Green LED -->
    <g transform="translate(290, 290)">
      <line x1="28" y1="55" x2="28" y2="150" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
      <line x1="42" y1="55" x2="42" y2="165" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
      <path d="M20 55 L20 30 C20 10, 50 10, 50 30 L50 55 Z" fill="#22c55e" stroke="#15803d" stroke-width="3" />
      <ellipse cx="35" cy="55" rx="18" ry="6" fill="#16a34a" stroke="#15803d" stroke-width="2" />
      <ellipse cx="35" cy="25" rx="8" ry="12" fill="#86efac" opacity="0.6" />
    </g>
    <!-- Blue LED -->
    <g transform="translate(390, 295)">
      <line x1="28" y1="55" x2="28" y2="145" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
      <line x1="42" y1="55" x2="42" y2="160" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
      <path d="M20 55 L20 30 C20 10, 50 10, 50 30 L50 55 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3" />
      <ellipse cx="35" cy="55" rx="18" ry="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
      <ellipse cx="35" cy="25" rx="8" ry="12" fill="#93c5fd" opacity="0.6" />
    </g>
    <!-- Yellow LED -->
    <g transform="translate(490, 310)">
      <line x1="28" y1="55" x2="28" y2="130" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
      <line x1="42" y1="55" x2="42" y2="145" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
      <path d="M20 55 L20 30 C20 10, 50 10, 50 30 L50 55 Z" fill="#eab308" stroke="#a16207" stroke-width="3" />
      <ellipse cx="35" cy="55" rx="18" ry="6" fill="#ca8a04" stroke="#a16207" stroke-width="2" />
      <ellipse cx="35" cy="25" rx="8" ry="12" fill="#fef08a" opacity="0.7" />
    </g>
  </g>
</svg>
