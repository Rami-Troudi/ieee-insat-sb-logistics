<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of M3 screws and brass standoff hardware pack">
  <defs>
    <linearGradient id="hw-bg" x2="0" y2="1">
      <stop stop-color="#f8fafc" />
      <stop offset="1" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="hw-brass" x2="1" y2="0">
      <stop stop-color="#d97706" />
      <stop offset="0.5" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="hw-steel" x2="1" y2="0">
      <stop stop-color="#64748b" />
      <stop offset="0.5" stop-color="#e2e8f0" />
      <stop offset="1" stop-color="#475569" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#hw-bg)" />
  <ellipse cx="400" cy="480" rx="260" ry="34" fill="#64748b" opacity=".2" />
  <!-- Organizer Tray Box -->
  <g transform="rotate(3 400 300)">
    <rect x="170" y="140" width="460" height="320" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="8" opacity="0.95" />
    <line x1="170" y1="300" x2="630" y2="300" stroke="#cbd5e1" stroke-width="6" />
    <line x1="320" y1="140" x2="320" y2="460" stroke="#cbd5e1" stroke-width="6" />
    <line x1="480" y1="140" x2="480" y2="460" stroke="#cbd5e1" stroke-width="6" />
    <!-- Compartment 1: Brass Hex Standoffs -->
    <g transform="translate(195, 170)">
      <rect x="10" y="10" width="22" height="70" rx="2" fill="url(#hw-brass)" stroke="#92400e" stroke-width="2" />
      <line x1="21" y1="10" x2="21" y2="80" stroke="#fef08a" stroke-width="2" />
      <rect x="45" y="15" width="22" height="65" rx="2" fill="url(#hw-brass)" stroke="#92400e" stroke-width="2" />
      <line x1="56" y1="15" x2="56" y2="80" stroke="#fef08a" stroke-width="2" />
      <rect x="80" y="10" width="22" height="70" rx="2" fill="url(#hw-brass)" stroke="#92400e" stroke-width="2" />
      <line x1="91" y1="10" x2="91" y2="80" stroke="#fef08a" stroke-width="2" />
    </g>
    <!-- Compartment 2: Long M3 Machine Screws -->
    <g transform="translate(345, 160)">
      <!-- Screw 1 -->
      <rect x="25" y="10" width="30" height="15" rx="3" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
      <rect x="34" y="25" width="12" height="75" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
      <line x1="34" y1="40" x2="46" y2="40" stroke="#334155" stroke-width="2" />
      <line x1="34" y1="55" x2="46" y2="55" stroke="#334155" stroke-width="2" />
      <line x1="34" y1="70" x2="46" y2="70" stroke="#334155" stroke-width="2" />
      <line x1="34" y1="85" x2="46" y2="85" stroke="#334155" stroke-width="2" />
      <!-- Screw 2 -->
      <rect x="65" y="10" width="30" height="15" rx="3" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
      <rect x="74" y="25" width="12" height="75" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
      <line x1="74" y1="40" x2="86" y2="40" stroke="#334155" stroke-width="2" />
      <line x1="74" y1="55" x2="86" y2="55" stroke="#334155" stroke-width="2" />
      <line x1="74" y1="70" x2="86" y2="70" stroke="#334155" stroke-width="2" />
      <line x1="74" y1="85" x2="86" y2="85" stroke="#334155" stroke-width="2" />
    </g>
    <!-- Compartment 3: Hex Nuts & Washers -->
    <g transform="translate(505, 175)">
      <polygon points="35,15 55,25 55,50 35,60 15,50 15,25" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
      <circle cx="35" cy="37" r="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
      <polygon points="75,35 95,45 95,70 75,80 55,70 55,45" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
      <circle cx="75" cy="57" r="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
      <!-- Washer -->
      <circle cx="45" cy="85" r="18" fill="none" stroke="url(#hw-steel)" stroke-width="7" />
    </g>
    <!-- Compartment 4, 5, 6: Assortment of Short Screws & Fasteners -->
    <g transform="translate(200, 330)">
      <polygon points="40,25 60,35 60,60 40,70 20,60 20,35" fill="url(#hw-brass)" stroke="#92400e" stroke-width="2" />
      <circle cx="40" cy="47" r="9" fill="#f1f5f9" stroke="#92400e" stroke-width="2" />
      <polygon points="80,15 100,25 100,50 80,60 60,50 60,25" fill="url(#hw-brass)" stroke="#92400e" stroke-width="2" />
      <circle cx="80" cy="37" r="9" fill="#f1f5f9" stroke="#92400e" stroke-width="2" />
    </g>
    <g transform="translate(360, 330)">
      <rect x="20" y="20" width="26" height="12" rx="2" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
      <rect x="28" y="32" width="10" height="40" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
      <rect x="60" y="20" width="26" height="12" rx="2" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
      <rect x="68" y="32" width="10" height="40" fill="url(#hw-steel)" stroke="#334155" stroke-width="2" />
    </g>
    <g transform="translate(520, 340)">
      <circle cx="35" cy="40" r="18" fill="none" stroke="url(#hw-steel)" stroke-width="7" />
      <circle cx="70" cy="40" r="18" fill="none" stroke="url(#hw-steel)" stroke-width="7" />
    </g>
  </g>
</svg>
