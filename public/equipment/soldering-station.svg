<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a digital soldering station">
  <defs>
    <linearGradient id="ss-bg" x2="0" y2="1">
      <stop stop-color="#fffbeb" />
      <stop offset="1" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="ss-base" x2="1" y2="1">
      <stop stop-color="#0284c7" />
      <stop offset="1" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="ss-iron" x2="1" y2="0">
      <stop stop-color="#334155" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#ss-bg)" />
  <ellipse cx="400" cy="485" rx="270" ry="34" fill="#64748b" opacity=".2" />
  <!-- Main Station Console Unit -->
  <g transform="rotate(-2 270 330)">
    <rect x="130" y="210" width="280" height="230" rx="20" fill="url(#ss-base)" stroke="#075985" stroke-width="8" />
    <!-- Front Faceplate -->
    <rect x="150" y="230" width="240" height="190" rx="12" fill="#0f172a" />
    <!-- Digital LCD Screen -->
    <rect x="170" y="245" width="200" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <text x="185" y="300" font-family="monospace" font-size="42" font-weight="bold" fill="#38bdf8" letter-spacing="2">350°C</text>
    <text x="315" y="280" font-family="sans-serif" font-size="12" font-weight="bold" fill="#facc15">SET: 350</text>
    <text x="315" y="315" font-family="sans-serif" font-size="10" fill="#94a3b8">ESD SAFE</text>
    <!-- Temperature Adjustment Buttons -->
    <circle cx="200" cy="370" r="16" fill="#334155" stroke="#64748b" stroke-width="3" />
    <path d="M194 373 L200 365 L206 373" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="250" cy="370" r="16" fill="#334155" stroke="#64748b" stroke-width="3" />
    <path d="M244 367 L250 375 L256 367" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Power Rocker Switch -->
    <rect x="310" y="355" width="50" height="30" rx="6" fill="#ef4444" stroke="#991b1b" stroke-width="3" />
    <line x1="335" y1="362" x2="335" y2="378" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
  <!-- Soldering Iron Stand with Safety Spiral Cage -->
  <g transform="rotate(4 530 350)">
    <!-- Heavy Stand Base -->
    <rect x="440" y="340" width="180" height="90" rx="14" fill="#334155" stroke="#1e293b" stroke-width="6" />
    <!-- Cleaning Sponge Tray -->
    <rect x="455" y="365" width="60" height="50" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="3" />
    <!-- Brass Wire Sponge -->
    <circle cx="560" cy="390" r="22" fill="#ca8a04" stroke="#a16207" stroke-width="3" />
    <!-- Metal Spiral Spring Holder -->
    <path d="M470 330 C 470 240, 560 210, 570 190" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
    <path d="M475 320 C 485 250, 555 220, 565 200" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
  </g>
  <!-- Soldering Pencil resting in stand -->
  <g transform="rotate(-36 540 220)">
    <!-- Silicone Heat Grip -->
    <rect x="480" y="190" width="120" height="30" rx="10" fill="url(#ss-iron)" stroke="#475569" stroke-width="4" />
    <!-- Finger Flange Shield -->
    <circle cx="480" cy="205" r="20" fill="#0284c7" />
    <!-- Chrome Heater Barrel -->
    <rect x="420" y="198" width="60" height="14" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <!-- Fine Chisel Copper / Nickel Tip -->
    <polygon points="420,201 420,209 385,207 380,205 385,203" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
    <!-- Flexible Silicone Cord linking iron to station -->
    <path d="M600 205 C 680 230, 620 460, 420 420" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
