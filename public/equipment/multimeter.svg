<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a digital multimeter with probes">
  <defs>
    <linearGradient id="m-bg" x2="0" y2="1">
      <stop stop-color="#fefce8" />
      <stop offset="1" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="m-body" x2="1" y2="1">
      <stop stop-color="#f59e0b" />
      <stop offset="1" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="m-screen" x2="0" y2="1">
      <stop stop-color="#cbd5e1" />
      <stop offset="1" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#m-bg)" />
  <ellipse cx="400" cy="480" rx="230" ry="32" fill="#64748b" opacity=".2" />
  <g transform="rotate(-4 400 290)">
    <!-- Yellow Outer Rugged Holster -->
    <rect x="250" y="110" width="300" height="420" rx="36" fill="url(#m-body)" stroke="#b45309" stroke-width="8" />
    <!-- Inner Dark Grey Housing -->
    <rect x="270" y="130" width="260" height="380" rx="24" fill="#1e293b" />
    <!-- Digital LCD Display -->
    <rect x="290" y="150" width="220" height="110" rx="14" fill="url(#m-screen)" stroke="#475569" stroke-width="5" />
    <text x="310" y="215" font-family="monospace" font-size="44" font-weight="bold" fill="#0f172a" letter-spacing="2">0.00</text>
    <text x="465" y="200" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0f172a">V</text>
    <text x="310" y="245" font-family="sans-serif" font-size="14" fill="#334155">AUTO RANGE • TRUE RMS</text>
    <!-- Rotary Dial Background & Knob -->
    <circle cx="400" cy="335" r="58" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <circle cx="400" cy="335" r="42" fill="#334155" stroke="#64748b" stroke-width="4" />
    <!-- Pointer on dial -->
    <line x1="400" y1="335" x2="400" y2="300" stroke="#facc15" stroke-width="6" stroke-linecap="round" />
    <!-- Dial Range Labels around knob -->
    <circle cx="345" cy="335" r="5" fill="#facc15" />
    <circle cx="360" cy="285" r="5" fill="#facc15" />
    <circle cx="400" cy="270" r="5" fill="#ef4444" />
    <circle cx="440" cy="285" r="5" fill="#38bdf8" />
    <circle cx="455" cy="335" r="5" fill="#38bdf8" />
    <!-- Input Jacks at Bottom -->
    <circle cx="340" cy="445" r="16" fill="#0f172a" stroke="#ef4444" stroke-width="6" />
    <circle cx="400" cy="445" r="16" fill="#0f172a" stroke="#64748b" stroke-width="6" />
    <circle cx="460" cy="445" r="16" fill="#0f172a" stroke="#ef4444" stroke-width="6" />
    <text x="325" y="475" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">10A</text>
    <text x="385" y="475" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">COM</text>
    <text x="445" y="475" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">V-Ω</text>
  </g>
  <!-- Red & Black Probes -->
  <path d="M400 480 C 370 540, 200 520, 180 430" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
  <rect x="165" y="340" width="22" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3" />
  <polygon points="172,340 180,340 176,280" fill="#94a3b8" />
  <path d="M460 480 C 490 550, 640 520, 620 420" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
  <rect x="615" y="330" width="22" height="95" rx="6" fill="#dc2626" stroke="#991b1b" stroke-width="3" />
  <polygon points="622,330 630,330 626,270" fill="#94a3b8" />
</svg>
