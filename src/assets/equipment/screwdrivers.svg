<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of precision screwdriver set">
  <defs>
    <linearGradient id="sc-bg" x2="0" y2="1">
      <stop stop-color="#f1f5f9" />
      <stop offset="1" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="sc-handle" x2="1" y2="0">
      <stop stop-color="#2563eb" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#sc-bg)" />
  <ellipse cx="400" cy="480" rx="260" ry="34" fill="#64748b" opacity=".2" />
  <!-- Magnetic Bit Case Base -->
  <g transform="rotate(4 400 300)">
    <rect x="180" y="140" width="440" height="320" rx="20" fill="#0f172a" stroke="#334155" stroke-width="8" />
    <rect x="200" y="160" width="400" height="280" rx="12" fill="#1e293b" />
    <!-- Rows of Precision Micro Bits (64-bit tray) -->
    <!-- Row 1 -->
    <g fill="#94a3b8" stroke="#475569" stroke-width="1.5">
      <rect x="230" y="180" width="12" height="35" rx="3" /><rect x="260" y="180" width="12" height="35" rx="3" />
      <rect x="290" y="180" width="12" height="35" rx="3" /><rect x="320" y="180" width="12" height="35" rx="3" />
      <rect x="350" y="180" width="12" height="35" rx="3" /><rect x="380" y="180" width="12" height="35" rx="3" />
      <rect x="410" y="180" width="12" height="35" rx="3" /><rect x="440" y="180" width="12" height="35" rx="3" />
      <rect x="470" y="180" width="12" height="35" rx="3" /><rect x="500" y="180" width="12" height="35" rx="3" />
      <rect x="530" y="180" width="12" height="35" rx="3" /><rect x="560" y="180" width="12" height="35" rx="3" />
    </g>
    <!-- Row 2 -->
    <g fill="#cbd5e1" stroke="#475569" stroke-width="1.5">
      <rect x="230" y="230" width="12" height="35" rx="3" /><rect x="260" y="230" width="12" height="35" rx="3" />
      <rect x="290" y="230" width="12" height="35" rx="3" /><rect x="320" y="230" width="12" height="35" rx="3" />
      <rect x="350" y="230" width="12" height="35" rx="3" /><rect x="380" y="230" width="12" height="35" rx="3" />
      <rect x="410" y="230" width="12" height="35" rx="3" /><rect x="440" y="230" width="12" height="35" rx="3" />
      <rect x="470" y="230" width="12" height="35" rx="3" /><rect x="500" y="230" width="12" height="35" rx="3" />
      <rect x="530" y="230" width="12" height="35" rx="3" /><rect x="560" y="230" width="12" height="35" rx="3" />
    </g>
    <!-- Precision Screwdriver Handle resting across tray -->
    <g transform="rotate(-30 400 320)">
      <!-- Swivel top cap -->
      <ellipse cx="250" cy="330" rx="16" ry="12" fill="#0f172a" stroke="#334155" stroke-width="3" />
      <!-- Knurled grip body -->
      <rect x="260" y="318" width="180" height="24" rx="8" fill="url(#sc-handle)" stroke="#1e40af" stroke-width="3" />
      <!-- Knurling texture lines -->
      <line x1="280" y1="318" x2="280" y2="342" stroke="#1d4ed8" stroke-width="3" />
      <line x1="300" y1="318" x2="300" y2="342" stroke="#1d4ed8" stroke-width="3" />
      <line x1="320" y1="318" x2="320" y2="342" stroke="#1d4ed8" stroke-width="3" />
      <line x1="340" y1="318" x2="340" y2="342" stroke="#1d4ed8" stroke-width="3" />
      <!-- Chuck socket collar -->
      <rect x="440" y="322" width="30" height="16" rx="4" fill="#64748b" stroke="#334155" stroke-width="2" />
      <!-- Inserted 4mm Phillips Bit -->
      <rect x="470" y="326" width="35" height="8" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
      <polygon points="505,326 518,330 505,334" fill="#94a3b8" />
    </g>
  </g>
</svg>
