<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of double aluminum omni-directional wheels">
  <defs>
    <linearGradient id="ow-bg" x2="0" y2="1">
      <stop stop-color="#f0f9ff" />
      <stop offset="1" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="ow-plate" x2="1" y2="1">
      <stop stop-color="#94a3b8" />
      <stop offset="0.5" stop-color="#cbd5e1" />
      <stop offset="1" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="ow-roller" x2="1" y2="0">
      <stop stop-color="#334155" />
      <stop offset="0.5" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#ow-bg)" />
  <ellipse cx="400" cy="490" rx="260" ry="34" fill="#64748b" opacity=".2" />
  <!-- Left Wheel (slightly angled) -->
  <g transform="translate(290, 310) scale(0.9) rotate(-15)">
    <!-- Main Aluminum Disc Body -->
    <circle cx="0" cy="0" r="140" fill="url(#ow-plate)" stroke="#475569" stroke-width="8" />
    <!-- Weight reduction cutouts -->
    <circle cx="0" cy="0" r="95" fill="#f0f9ff" stroke="#475569" stroke-width="6" />
    <!-- Outer Perimeter Barrel Rollers -->
    <g>
      <!-- 8 Rollers around perimeter -->
      <rect x="-24" y="-155" width="48" height="28" rx="8" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="90" y="-120" width="48" height="28" rx="8" transform="rotate(45 114 -106)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="130" y="-14" width="48" height="28" rx="8" transform="rotate(90 154 0)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="90" y="90" width="48" height="28" rx="8" transform="rotate(135 114 104)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="-24" y="130" width="48" height="28" rx="8" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="-135" y="90" width="48" height="28" rx="8" transform="rotate(45 -111 104)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="-175" y="-14" width="48" height="28" rx="8" transform="rotate(90 -151 0)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="-135" y="-120" width="48" height="28" rx="8" transform="rotate(135 -111 -106)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
    </g>
    <!-- Center Aluminum Hub -->
    <circle cx="0" cy="0" r="48" fill="url(#ow-plate)" stroke="#334155" stroke-width="5" />
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <circle cx="0" cy="-28" r="4" fill="#0f172a" />
    <circle cx="28" cy="0" r="4" fill="#0f172a" />
    <circle cx="0" cy="28" r="4" fill="#0f172a" />
    <circle cx="-28" cy="0" r="4" fill="#0f172a" />
  </g>
  <!-- Right Wheel (overlapping pair view) -->
  <g transform="translate(500, 290) scale(0.95) rotate(10)">
    <circle cx="0" cy="0" r="140" fill="url(#ow-plate)" stroke="#475569" stroke-width="8" />
    <circle cx="0" cy="0" r="95" fill="#f0f9ff" stroke="#475569" stroke-width="6" />
    <!-- 8 Rollers around perimeter -->
    <g>
      <rect x="-24" y="-155" width="48" height="28" rx="8" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="90" y="-120" width="48" height="28" rx="8" transform="rotate(45 114 -106)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="130" y="-14" width="48" height="28" rx="8" transform="rotate(90 154 0)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="90" y="90" width="48" height="28" rx="8" transform="rotate(135 114 104)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="-24" y="130" width="48" height="28" rx="8" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="-135" y="90" width="48" height="28" rx="8" transform="rotate(45 -111 104)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="-175" y="-14" width="48" height="28" rx="8" transform="rotate(90 -151 0)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
      <rect x="-135" y="-120" width="48" height="28" rx="8" transform="rotate(135 -111 -106)" fill="url(#ow-roller)" stroke="#0f172a" stroke-width="3" />
    </g>
    <circle cx="0" cy="0" r="48" fill="url(#ow-plate)" stroke="#334155" stroke-width="5" />
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <circle cx="0" cy="-28" r="4" fill="#0f172a" />
    <circle cx="28" cy="0" r="4" fill="#0f172a" />
    <circle cx="0" cy="28" r="4" fill="#0f172a" />
    <circle cx="-28" cy="0" r="4" fill="#0f172a" />
  </g>
</svg>
