<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of hot melt glue gun and glue sticks">
  <defs>
    <linearGradient id="gg-bg" x2="0" y2="1">
      <stop stop-color="#fffbeb" />
      <stop offset="1" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="gg-body" x2="1" y2="1">
      <stop stop-color="#ea580c" />
      <stop offset="1" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="gg-stick" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#gg-bg)" />
  <ellipse cx="400" cy="480" rx="260" ry="34" fill="#64748b" opacity=".2" />
  <!-- Stack of Clear Glue Sticks in Background -->
  <g transform="rotate(12 280 430)">
    <rect x="180" y="380" width="220" height="24" rx="12" fill="url(#gg-stick)" stroke="#cbd5e1" stroke-width="2" />
    <rect x="160" y="410" width="220" height="24" rx="12" fill="url(#gg-stick)" stroke="#cbd5e1" stroke-width="2" />
    <rect x="200" y="440" width="220" height="24" rx="12" fill="url(#gg-stick)" stroke="#cbd5e1" stroke-width="2" />
  </g>
  <!-- Hot Melt Glue Gun -->
  <g transform="rotate(-15 450 300)">
    <!-- Glue Stick Inserted at Rear -->
    <rect x="190" y="240" width="160" height="26" rx="13" fill="url(#gg-stick)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Main Gun Body Barrel -->
    <path d="M310 220 L530 220 C540 220, 550 230, 550 240 L550 290 C550 300, 540 310, 530 310 L350 310 C330 310, 310 290, 310 270 Z" fill="url(#gg-body)" stroke="#9a3412" stroke-width="8" />
    <!-- Handle -->
    <path d="M340 305 L370 450 C375 470, 410 470, 420 450 L425 310 Z" fill="url(#gg-body)" stroke="#9a3412" stroke-width="8" />
    <!-- Textured Grip on Handle -->
    <line x1="380" y1="360" x2="410" y2="360" stroke="#7c2d12" stroke-width="4" stroke-linecap="round" />
    <line x1="385" y1="390" x2="415" y2="390" stroke="#7c2d12" stroke-width="4" stroke-linecap="round" />
    <line x1="390" y1="420" x2="415" y2="420" stroke="#7c2d12" stroke-width="4" stroke-linecap="round" />
    <!-- Trigger -->
    <path d="M435 320 L455 350 C460 365, 450 380, 435 375 L430 320 Z" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <!-- Trigger Guard -->
    <path d="M420 310 C480 320, 480 400, 425 410" fill="none" stroke="#9a3412" stroke-width="8" />
    <!-- Brass / Copper Heated Extrusion Nozzle -->
    <polygon points="550,240 590,250 590,260 550,270" fill="#f59e0b" stroke="#d97706" stroke-width="3" />
    <circle cx="590" cy="255" r="3" fill="#78350f" />
    <!-- Foldable Wire Stand -->
    <path d="M510 305 L540 380 L520 380" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <!-- Drop of clear glue -->
    <circle cx="610" cy="265" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" opacity="0.85" />
  </g>
</svg>
