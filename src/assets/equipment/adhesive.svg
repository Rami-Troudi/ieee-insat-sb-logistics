<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of cyanoacrylate structural adhesive">
  <defs>
    <linearGradient id="ad-bg" x2="0" y2="1">
      <stop stop-color="#f5f3ff" />
      <stop offset="1" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="ad-bottle" x2="1" y2="0">
      <stop stop-color="#f8fafc" />
      <stop offset="0.6" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#ad-bg)" />
  <ellipse cx="400" cy="480" rx="220" ry="32" fill="#64748b" opacity=".2" />
  <g transform="rotate(-5 400 300)">
    <!-- Main Bottle Body -->
    <rect x="300" y="240" width="200" height="230" rx="28" fill="url(#ad-bottle)" stroke="#94a3b8" stroke-width="7" />
    <!-- Shoulder Taper -->
    <path d="M300 250 C 300 200, 360 190, 370 190 L 430 190 C 440 190, 500 200, 500 250 Z" fill="url(#ad-bottle)" stroke="#94a3b8" stroke-width="7" />
    <!-- Threaded Neck -->
    <rect x="370" y="155" width="60" height="35" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="4" />
    <line x1="370" y1="167" x2="430" y2="167" stroke="#64748b" stroke-width="3" />
    <line x1="370" y1="178" x2="430" y2="178" stroke="#64748b" stroke-width="3" />
    <!-- Red Precision Applicator Nozzle & Cap -->
    <polygon points="380,155 420,155 405,80 395,80" fill="#dc2626" stroke="#991b1b" stroke-width="4" />
    <circle cx="400" cy="76" r="4" fill="#ef4444" />
    <!-- Technical Product Label -->
    <rect x="320" y="270" width="160" height="170" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="4" />
    <text x="335" y="310" font-family="sans-serif" font-size="22" font-weight="900" fill="#f8fafc" letter-spacing="1">STRONG</text>
    <text x="335" y="335" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">ADHESIVE</text>
    <rect x="335" y="350" width="130" height="26" rx="4" fill="#4338ca" />
    <text x="345" y="368" font-family="monospace" font-size="14" font-weight="bold" fill="#facc15">CA - 50g</text>
    <text x="335" y="400" font-family="sans-serif" font-size="10" fill="#a5b4fc">CYANOACRYLATE</text>
    <text x="335" y="415" font-family="sans-serif" font-size="9" fill="#818cf8">FAST CURE • HIGH VISCOSITY</text>
    <!-- Liquid drop at nozzle -->
    <path d="M400 65 C 395 72, 405 72, 400 65" fill="#38bdf8" />
  </g>
</svg>
